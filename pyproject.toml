[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-arrhythmia-classifier"
version = "1.0.0"
description = "Inter-patient MIT-BIH ECG beat classification"
requires-python = ">=3.10"
dependencies = ["wfdb>=4.1", "numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "matplotlib>=3.7", "pandas>=2.0", "torch>=2.0", "PyYAML>=6.0", "requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]
